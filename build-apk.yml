name: Build BatteryKeeper 1.5 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Extract BatteryKeeper source
        run: |
          rm -rf build-src
          mkdir -p build-src
          unzip -q BatteryKeeper-v1.5.0-source.zip -d build-src
          chmod +x build-src/BatteryKeeper-v1.5.0/gradlew

      - name: Build Debug APK
        working-directory: build-src/BatteryKeeper-v1.5.0
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Rename APK
        run: |
          cp build-src/BatteryKeeper-v1.5.0/app/build/outputs/apk/debug/app-debug.apk BatteryKeeper-v1.5.0-debug.apk
          sha256sum BatteryKeeper-v1.5.0-debug.apk > BatteryKeeper-v1.5.0-debug.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BatteryKeeper-v1.5.0-APK
          path: |
            BatteryKeeper-v1.5.0-debug.apk
            BatteryKeeper-v1.5.0-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
