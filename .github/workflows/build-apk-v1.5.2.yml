name: Build BatteryKeeper 1.5.2 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Verify v1.5.2 source
        run: |
          grep -q 'versionCode = 11' app/build.gradle.kts
          grep -q 'versionName = "1.5.2"' app/build.gradle.kts
          grep -q '连接电源时常驻' app/src/main/java/com/batterykeeper/app/ui/screens/SettingsScreen.kt
          if grep -q '电池管家 v1.5.0' app/src/main/java/com/batterykeeper/app/ui/screens/SettingsScreen.kt; then
            echo 'ERROR: stale hard-coded v1.5.0 UI text remains'
            exit 1
          fi
          echo 'Verified BatteryKeeper v1.5.2 / versionCode 11 / dynamic Settings version text'

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Rename and checksum APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk BatteryKeeper-v1.5.2-debug.apk
          sha256sum BatteryKeeper-v1.5.2-debug.apk > BatteryKeeper-v1.5.2-debug.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BatteryKeeper-v1.5.2-APK
          path: |
            BatteryKeeper-v1.5.2-debug.apk
            BatteryKeeper-v1.5.2-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
