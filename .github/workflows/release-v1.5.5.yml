name: Publish BatteryKeeper 1.5.5

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/release-v1.5.5.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Verify v1.5.5 source
        run: |
          grep -q 'versionCode = 15' app/build.gradle.kts
          grep -q 'versionName = "1.5.5"' app/build.gradle.kts
          grep -q '热爱生活·为您充电！' app/src/main/java/com/batterykeeper/app/ui/screens/DashboardScreen.kt
          grep -q 'PickVisualMedia' app/src/main/java/com/batterykeeper/app/ui/screens/ReportsScreen.kt
          grep -q 'findLatestBugReport' app/src/main/java/com/batterykeeper/app/report/ReportFileLocator.kt

      - name: Prepare permanent signing key
        env:
          KEYSTORE_B64: ${{ secrets.BATTERYKEEPER_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.BATTERYKEEPER_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BATTERYKEEPER_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BATTERYKEEPER_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          mkdir -p signing
          printf '%s' "$KEYSTORE_B64" | base64 --decode > signing/batterykeeper-fixed.jks
          cat > keystore.properties <<EOF2
          storeFile=signing/batterykeeper-fixed.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF2

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk BatteryKeeper-v1.5.5-fixed-debug.apk
          sha256sum BatteryKeeper-v1.5.5-fixed-debug.apk > BatteryKeeper-v1.5.5-fixed-debug.apk.sha256
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose --print-certs BatteryKeeper-v1.5.5-fixed-debug.apk
          $ANDROID_HOME/build-tools/36.0.0/aapt dump badging BatteryKeeper-v1.5.5-fixed-debug.apk | head -1

      - name: Prepare release notes
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          # BatteryKeeper 1.5.5

          本版重点更新：
          - 首页标语更新为「热爱生活·为您充电！」，并精简卡片底部冗余说明。
          - 报表顶部重新设计，突出健康度、满充容量与循环次数。
          - 图片导入改用系统相册 Photo Picker，支持小米电池健康历史截图识别。
          - 新增一键查找最新错误报告；首次授权 MIUI/debug_log 后可自动选择最新 ZIP。
          - ZIP 报告继续兼容 HyperOS 3 / HyperOS 4 的 Health HAL、AIDL HealthInfo、power_supply 与 batterystats。
          - 延续统一通知、超级岛稳定性优化与固定签名。

          包名：com.batterykeeper.app  
          versionCode：15  
          versionName：1.5.5
          EOF

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.5.5 >/dev/null 2>&1; then
            gh release upload v1.5.5 BatteryKeeper-v1.5.5-fixed-debug.apk BatteryKeeper-v1.5.5-fixed-debug.apk.sha256 --clobber
            gh release edit v1.5.5 --title "BatteryKeeper 1.5.5" --notes-file RELEASE_NOTES.md
          else
            gh release create v1.5.5 BatteryKeeper-v1.5.5-fixed-debug.apk BatteryKeeper-v1.5.5-fixed-debug.apk.sha256 --target "$GITHUB_SHA" --title "BatteryKeeper 1.5.5" --notes-file RELEASE_NOTES.md
          fi
