name: Export Android offline toolchain for Jiqian

on:
  push:
    branches:
      - jiqian-toolchain-export

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install Android 35 packages
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"; fi
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Download Gradle 8.9
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/jiqian-tools"
          curl -fL --retry 3 --retry-delay 2             https://services.gradle.org/distributions/gradle-8.9-bin.zip             -o "$RUNNER_TEMP/jiqian-tools/gradle-8.9-bin.zip"
          unzip -q "$RUNNER_TEMP/jiqian-tools/gradle-8.9-bin.zip" -d "$RUNNER_TEMP/jiqian-tools"

      - name: Warm exact Gradle and Maven dependencies
        shell: bash
        run: |
          set -euxo pipefail
          P="$RUNNER_TEMP/warm"
          mkdir -p "$P/app/src/main"
          cat > "$P/settings.gradle.kts" <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url = uri("https://jitpack.io") }
              }
          }
          rootProject.name = "warm"
          include(":app")
          EOF
          cat > "$P/build.gradle.kts" <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          EOF
          cat > "$P/gradle.properties" <<'EOF'
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          kotlin.code.style=official
          EOF
          cat > "$P/app/build.gradle.kts" <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }
          android {
              namespace = "toolchain.warm"
              compileSdk = 35
              defaultConfig {
                  applicationId = "toolchain.warm"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
          }
          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.10.01")
              implementation(composeBom)
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.activity:activity-compose:1.9.3")
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("cz.adaptech.tesseract4android:tesseract4android:4.9.0")
              debugImplementation("androidx.compose.ui:ui-tooling")
          }
          EOF
          cat > "$P/app/src/main/AndroidManifest.xml" <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:theme="@style/AppTheme" />
          </manifest>
          EOF
          mkdir -p "$P/app/src/main/res/values"
          cat > "$P/app/src/main/res/values/styles.xml" <<'EOF'
          <resources><style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar"/></resources>
          EOF
          cd "$P"
          "$RUNNER_TEMP/jiqian-tools/gradle-8.9/bin/gradle" --no-daemon :app:assembleDebug

      - name: Pack Android SDK subset
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/sdk-export"
          cp -a "$ANDROID_HOME/platforms/android-35" "$RUNNER_TEMP/sdk-export/platforms-android-35"
          cp -a "$ANDROID_HOME/build-tools/35.0.0" "$RUNNER_TEMP/sdk-export/build-tools-35.0.0"
          if [ -d "$ANDROID_HOME/platform-tools" ]; then cp -a "$ANDROID_HOME/platform-tools" "$RUNNER_TEMP/sdk-export/platform-tools"; fi
          if [ -d "$ANDROID_HOME/licenses" ]; then cp -a "$ANDROID_HOME/licenses" "$RUNNER_TEMP/sdk-export/licenses"; fi
          tar -C "$RUNNER_TEMP/sdk-export" -cf "$RUNNER_TEMP/android-sdk-35.tar" .

      - name: Pack Gradle dependency cache
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/gradle-cache-export"
          cp -a "$HOME/.gradle/caches" "$RUNNER_TEMP/gradle-cache-export/caches"
          tar -C "$RUNNER_TEMP/gradle-cache-export" -cf "$RUNNER_TEMP/gradle-cache.tar" .

      - name: Upload Gradle distribution
        uses: actions/upload-artifact@v4
        with:
          name: gradle-8.9
          path: ${{ runner.temp }}/jiqian-tools/gradle-8.9-bin.zip
          retention-days: 1
          compression-level: 0

      - name: Upload Android SDK subset
        uses: actions/upload-artifact@v4
        with:
          name: android-sdk-35
          path: ${{ runner.temp }}/android-sdk-35.tar
          retention-days: 1
          compression-level: 0

      - name: Upload Gradle cache
        uses: actions/upload-artifact@v4
        with:
          name: gradle-cache-jiqian
          path: ${{ runner.temp }}/gradle-cache.tar
          retention-days: 1
          compression-level: 0
