name: Check Jiqian release secret presence

on:
  push:
    branches:
      - jiqian-toolchain-export

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Report configured secret names only
        shell: bash
        env:
          JIQIAN_KEYSTORE_B64: ${{ secrets.JIQIAN_KEYSTORE_B64 }}
          JIQIAN_STORE_PASSWORD: ${{ secrets.JIQIAN_STORE_PASSWORD }}
          JIQIAN_KEY_ALIAS: ${{ secrets.JIQIAN_KEY_ALIAS }}
          JIQIAN_KEY_PASSWORD: ${{ secrets.JIQIAN_KEY_PASSWORD }}
          APPSTORE_PUBLISHER_TOKEN: ${{ secrets.APPSTORE_PUBLISHER_TOKEN }}
          PUBLISHER_TOKEN: ${{ secrets.PUBLISHER_TOKEN }}
          APPSTORE_TOKEN: ${{ secrets.APPSTORE_TOKEN }}
        run: |
          for n in JIQIAN_KEYSTORE_B64 JIQIAN_STORE_PASSWORD JIQIAN_KEY_ALIAS JIQIAN_KEY_PASSWORD APPSTORE_PUBLISHER_TOKEN PUBLISHER_TOKEN APPSTORE_TOKEN; do
            if [ -n "${!n:-}" ]; then echo "$n=yes"; else echo "$n=no"; fi
          done
