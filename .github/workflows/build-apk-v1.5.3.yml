name: Build BatteryKeeper 1.6.0 Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Prepare permanent signing key
        env:
          KEYSTORE_B64: ${{ secrets.BATTERYKEEPER_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.BATTERYKEEPER_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BATTERYKEEPER_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BATTERYKEEPER_KEY_PASSWORD }}
        run: |
          mkdir -p signing
          printf '%s' "$KEYSTORE_B64" | base64 --decode > signing/batterykeeper-fixed.jks
          cat > keystore.properties <<EOF2
          storeFile=signing/batterykeeper-fixed.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF2
      - name: Build release
        run: |
          grep -q 'versionCode = 17' app/build.gradle.kts
          grep -q 'versionName = "1.6.0"' app/build.gradle.kts
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - name: Verify release
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose --print-certs "$APK"
          if $ANDROID_HOME/build-tools/36.0.0/aapt dump badging "$APK" | grep -q 'application-debuggable'; then exit 1; fi
          cp "$APK" BatteryKeeper-v1.6.0-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BatteryKeeper-v1.6.0-Release-APK
          path: BatteryKeeper-v1.6.0-release.apk
          retention-days: 30
